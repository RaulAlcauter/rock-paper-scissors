<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1 id="you-text" class="large-text">YOU: 0</h1>
      <div class="buttons">
        <div class="human-buttons">
          <button id="human-rock" class="rock button">
            <img src="Rock-Pixel.png" alt="" />
          </button>
          <button id="human-paper" class="paper button">
            <img src="Paper-Pixel.png" alt="" />
          </button>
          <button id="human-scissors" class="Scissors button">
            <img src="Scissors-Pixel.png" alt="" />
          </button>
        </div>
        <div class="computer-buttons">
          <button id="cpu-rock" class="rock button">
            <img src="Rock-Pixel.png" alt="" />
          </button>
          <button id="cpu-paper" class="paper button">
            <img src="Paper-Pixel.png" alt="" />
          </button>
          <button id="cpu-scissors" class="Scissors button">
            <img src="Scissors-Pixel.png" alt="" />
          </button>
        </div>
      </div>
      <h1 id="cpu-text" class="large-text">CPU: 0</h1>
    </div>
  </body>
</html>
